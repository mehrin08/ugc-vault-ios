<style>
:root{
  --bg:linear-gradient(180deg,#FDF8F4 0%,#FBF2EC 45%,#F5EAE7 75%,#E8F1F8 100%);
  --ink:#2A201E; --muted:#7A6B67; --faint:#A99B96; --accent:#8C4A5E;
  --field:rgba(255,255,255,0.78);
  --glass-bg:rgba(255,255,255,0.78); --glass-bd:rgba(255,255,255,0.95);
  --sh:120,80,70;
  --glass-sh:0 8px 26px rgba(120,80,70,0.09), inset 0 1px 1px rgba(255,255,255,0.9);
  --s1:248,205,190; --s2:238,190,215; --sc1:#F7CDB8; --sc2:#EEBED6;
  --blob1:#FAD5C2; --blob2:#F3C7DC;
  --h1:#FCD2EC; --h2:#F282C2; --h3:#CE4E9C;
}
html[data-theme="dark"]{
  --bg:linear-gradient(160deg,#261D26 0%,#2C2129 45%,#241E22 75%,#1C232C 100%);
  --ink:#F7EDEA; --muted:#CDB9BA; --faint:#948288; --accent:#F3B9CB;
  --field:rgba(255,255,255,0.09);
  --glass-bg:rgba(255,255,255,0.07); --glass-bd:rgba(255,255,255,0.13);
  --sh:0,0,0;
  --glass-sh:0 12px 34px rgba(0,0,0,0.4), inset 0 1px 1px rgba(255,255,255,0.08);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
body{min-height:100vh;background:var(--bg);font-family:Inter,system-ui,sans-serif;position:relative;overflow-x:hidden;transition:background .4s ease}
.blob{position:fixed;border-radius:50%;filter:blur(20px);opacity:.7;z-index:0;pointer-events:none}
.blob.pink{top:-120px;right:-90px;width:320px;height:320px;background:radial-gradient(circle,var(--blob1),transparent 70%)}
.blob.lav{bottom:-140px;left:-100px;width:360px;height:360px;background:radial-gradient(circle,var(--blob2),transparent 70%)}
html[data-theme="dark"] .blob{opacity:.16;filter:blur(46px)}
html[data-theme="dark"] .overlay{background:rgba(14,8,14,.62)}
html[data-theme="dark"] .editor{background:rgba(44,33,42,.95)}
html[data-theme="dark"] .auth-in,html[data-theme="dark"] .txt-in,html[data-theme="dark"] .notes-area,html[data-theme="dark"] .script-body{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.16)}
html[data-theme="dark"] .plat-chip{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.16)}
main{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:40px 18px 72px}
@media (min-width:900px){main{max-width:94vw}}
@media (min-width:1400px){main{max-width:1320px}}
@media (min-width:900px){#lists{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:18px;align-items:start}}
@media (min-width:900px){#lists .list{margin-bottom:0}}
.glass{background:var(--glass-bg);backdrop-filter:blur(22px) saturate(165%);-webkit-backdrop-filter:blur(22px) saturate(165%);border:1px solid var(--glass-bd);box-shadow:var(--glass-sh)}
.xh{display:inline-block;vertical-align:-2px;filter:drop-shadow(0 1px 2px rgba(var(--s2),.8))}
.chandelier{position:relative;display:flex;justify-content:center;align-items:flex-start;gap:13px;height:60px;margin:-6px 0 4px;pointer-events:none}
.chandelier::before{content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);width:158px;height:2px;border-radius:2px;background:linear-gradient(90deg,transparent,rgba(var(--s1),.55),rgba(var(--s2),.55),transparent)}
.dangle{position:relative;transform-origin:top center;animation:sway 4s ease-in-out infinite}
.dangle .chain{width:1px;margin:0 auto;background:linear-gradient(rgba(var(--s1),.55),rgba(var(--s2),.45))}
.dangle .xh{display:block;margin-top:-1px}
@keyframes sway{0%,100%{transform:rotate(-3.2deg)}50%{transform:rotate(3.2deg)}}
/* header */
.top{display:flex;align-items:center;justify-content:space-between}
.title-wrap{display:flex;align-items:center;gap:9px}
h1{font-family:DM Sans,Outfit;font-weight:500;font-size:30.6px;color:var(--ink);letter-spacing:-.5px;line-height:1}
.date{font-family:DM Sans,Outfit;font-weight:300;font-size:12.2px;color:var(--muted);margin-top:8px;letter-spacing:.3px}
.top-right{display:flex;align-items:center;gap:8px}
.streak{display:flex;align-items:center;gap:5px;padding:5px 11px;border-radius:99px;color:var(--accent);background:linear-gradient(135deg,rgba(var(--s1),.6),rgba(var(--s2),.6));border:1px solid rgba(255,255,255,.7);box-shadow:inset 0 1px 1px rgba(255,255,255,.8);font-family:DM Sans,Outfit;font-weight:500;font-size:11.2px}
.theme-btn{width:40px;height:40px;border-radius:50%;cursor:pointer;font-size:14.4px;color:var(--accent);display:flex;align-items:center;justify-content:center;background:var(--glass-bg);border:1px solid var(--glass-bd);box-shadow:inset 0 1px 1px rgba(255,255,255,.5)}
.music-btn{color:var(--accent)}
html[data-theme="dark"] .music-btn{color:#FF7FC0}
.card{border-radius:20px;padding:14px 16px;margin-top:18px}
.prog-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}
.prog-head .l{font-family:DM Sans,Outfit;font-weight:500;font-size:12.2px;color:var(--ink);letter-spacing:.2px}
.prog-head .r{display:flex;align-items:center;gap:12px}
.pct{font-family:DM Sans,Outfit;font-weight:300;font-size:12.2px;color:var(--muted)}
.clear-btn{border:none;background:transparent;cursor:pointer;font-family:DM Sans,Outfit;font-size:11.2px;color:var(--sc2);padding:0}
.track{height:7px;border-radius:99px;background:rgba(255,255,255,.55);overflow:hidden;box-shadow:inset 0 1px 2px rgba(var(--sh),.15)}
.fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--sc1),var(--sc2));transition:width .5s cubic-bezier(.4,0,.2,1)}
.hours{border-radius:18px;padding:11px 15px;margin-top:12px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.hours .lab{font-family:DM Sans,Outfit;font-size:11.7px;color:var(--ink);letter-spacing:.2px;display:flex;align-items:center;gap:6px}
.hours .to{color:var(--muted);font-family:DM Sans,Outfit;font-size:10.8px}
input[type=time]{font-family:DM Sans,Outfit;font-size:11.7px;color:var(--accent);height:34px;padding:0 10px;border-radius:10px;border:1px solid var(--glass-bd);background:var(--field);outline:none;box-shadow:inset 0 1px 1px rgba(255,255,255,.5)}
input[type=time]::-webkit-calendar-picker-indicator{opacity:.35}
.notif-btn{margin-top:12px;width:100%;height:48px;border-radius:16px;cursor:pointer;font-family:DM Sans,Outfit;font-weight:500;font-size:12.2px;color:var(--accent);letter-spacing:.3px;display:flex;align-items:center;justify-content:center;gap:6px}
/* focus card */
.focus{border-radius:22px;padding:14px 16px;margin-bottom:18px;background:linear-gradient(135deg,rgba(255,255,255,.55),rgba(255,255,255,.4)),linear-gradient(135deg,rgba(var(--s1),.35),rgba(var(--s2),.35));border:1px solid rgba(255,255,255,.7);box-shadow:0 8px 24px rgba(var(--sh),.14);animation:pop .35s cubic-bezier(.2,.8,.2,1) both}
.focus .in{display:flex;align-items:center;gap:10px}
.focus .lab{font-family:DM Sans,Outfit;font-weight:300;font-size:9.9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--accent);opacity:.75;display:flex;align-items:center;gap:4px}
.focus .t{font-family:DM Sans,Outfit;font-weight:500;font-size:15.3px;color:var(--accent);overflow-wrap:anywhere;word-break:break-word;line-height:1.3}
/* list */
.list{border-radius:26px;padding:18px 16px 14px;margin-bottom:18px}
.list.lift{box-shadow:0 16px 40px rgba(var(--sh),.35);transform:scale(1.012)}
.list-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:6px;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.list-head .left{display:flex;align-items:center;gap:6px;flex:1;min-width:0}
h2{font-family:DM Sans,Outfit;font-weight:500;font-size:15.3px;color:var(--ink);letter-spacing:.2px;cursor:pointer;overflow-wrap:anywhere;word-break:break-word}
.list-head .right{display:flex;align-items:center;gap:6px;flex-shrink:0}
.grip{border:none;background:transparent;color:var(--faint);font-size:13.1px;cursor:grab;padding:2px 1px;flex-shrink:0;touch-action:none;line-height:1}
.grip.big{font-size:15.3px}
.emoji-btn{width:34px;height:34px;border-radius:10px;cursor:pointer;font-size:14.4px;line-height:1;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--muted);background:var(--field);border:1px solid var(--glass-bd)}
.remind-all{display:flex;align-items:center;gap:5px;height:32px;padding:0 11px;border-radius:99px;cursor:pointer;color:var(--accent);background:linear-gradient(135deg,rgba(var(--s1),.5),rgba(var(--s2),.5));border:1px solid rgba(255,255,255,.7);box-shadow:inset 0 1px 1px rgba(255,255,255,.5);font-family:DM Sans,Outfit;font-size:10.8px}
.ghost{border:none;background:transparent;color:var(--faint);font-size:18px;line-height:1;cursor:pointer;padding:2px 3px;flex-shrink:0;display:flex;align-items:center}
/* row */
.row{display:flex;align-items:center;gap:7px;padding:7px 4px;border-bottom:1px solid rgba(255,255,255,.4);border-radius:12px;transition:background .2s,box-shadow .2s;animation:rise .35s ease both;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.row:last-of-type{border-bottom:none}
.row.dragging{background:rgba(255,255,255,.6);box-shadow:0 8px 22px rgba(var(--sh),.28);border-bottom:1px solid transparent}
.check{width:26px;height:26px;border-radius:50%;flex-shrink:0;cursor:pointer;background:var(--field);border:1.5px solid rgba(var(--s2),.7);display:flex;align-items:center;justify-content:center;transition:all .2s;box-shadow:inset 0 1px 1px rgba(255,255,255,.6)}
.check.on{background:linear-gradient(135deg,var(--sc1),var(--sc2));border:1.5px solid transparent}
.check.on::after{content:"✓";color:#fff;font-size:11.2px;line-height:1}
.t-txt{flex:1;min-width:0;overflow-wrap:anywhere;word-break:break-word;font-family:Inter;font-size:15.5px;line-height:1.4;color:var(--ink);cursor:pointer;transition:color .2s}
.t-txt.done{color:var(--faint);text-decoration:line-through}
.star{border:none;background:transparent;cursor:pointer;font-size:16.2px;line-height:1;padding:2px;flex-shrink:0;color:var(--faint)}
.star.on{color:var(--sc2)}
.chip{position:relative;display:flex;align-items:center;gap:5px;height:40px;padding:0 13px;border-radius:99px;cursor:pointer;flex-shrink:0;color:var(--muted);background:var(--field);border:1px solid var(--glass-bd);font-family:DM Sans,Outfit;font-size:11.2px;box-shadow:inset 0 1px 1px rgba(255,255,255,.5);transition:all .2s}
.chip.on{background:linear-gradient(135deg,rgba(var(--s1),.55),rgba(var(--s2),.55));color:var(--accent);border:1px solid rgba(255,255,255,.6)}
.chip.sq{width:40px;justify-content:center;padding:0}
.repeat-i{font-size:15.3px;opacity:.7}
.chip.on .repeat-i{opacity:1}
/* add rows */
.add-row{display:flex;gap:8px;margin-top:10px;padding-left:4px}
.txt-in{flex:1;min-width:0;height:48px;padding:0 16px;border-radius:16px;outline:none;font-family:Inter;font-size:13.1px;color:var(--ink);background:var(--field);border:1px solid var(--glass-bd)}
.txt-in::placeholder{color:var(--faint)}
.add-btn{width:52px;height:48px;border-radius:16px;cursor:pointer;color:#fff;font-size:19.4px;line-height:1;border:1px solid rgba(255,255,255,.5);background:linear-gradient(135deg,var(--sc1),var(--sc2));box-shadow:0 6px 18px rgba(var(--s2),.35),inset 0 1px 1px rgba(255,255,255,.6)}
.newlist{border-radius:22px;padding:8px;display:flex;gap:8px;margin-top:4px}
.rename-in{font-family:DM Sans,Outfit;font-weight:500;font-size:15.3px;color:var(--ink);height:38px;padding:0 8px;border-radius:10px;background:var(--field);border:1px solid rgba(var(--s2),.6);outline:none;max-width:60%}
.rename-in.task{font-family:Inter;font-weight:400;font-size:13.5px;flex:1;max-width:none}
.foot{font-family:DM Sans,Outfit;font-weight:300;font-size:10.3px;color:var(--faint);text-align:center;margin-top:26px;letter-spacing:.3px;line-height:1.7}
/* banner */
.banner-wrap{position:fixed;top:14px;left:0;right:0;z-index:40;display:flex;justify-content:center;padding:0 14px;pointer-events:none}
.banner{position:relative;width:100%;max-width:420px;border-radius:22px;padding:16px 18px;pointer-events:auto;animation:drop .4s cubic-bezier(.2,.8,.2,1) both}
.banner .hd{display:flex;align-items:center;gap:9px;margin-bottom:12px}
.banner .ti{font-family:DM Sans,Outfit;font-weight:500;font-size:14px;color:var(--ink)}
.banner .su{font-family:DM Sans,Outfit;font-weight:300;font-size:10.8px;color:var(--muted)}
.banner .btns{display:flex;gap:8px}
.banner .x{position:absolute;top:10px;right:12px;border:none;background:transparent;color:var(--faint);font-size:18px;cursor:pointer}
.soft-btn{flex:1;height:46px;border-radius:14px;cursor:pointer;font-family:DM Sans,Outfit;font-size:11.7px;color:var(--accent);background:var(--field);border:1px solid var(--glass-bd);box-shadow:inset 0 1px 1px rgba(255,255,255,.5)}
.solid-btn{flex:1;height:46px;border-radius:14px;cursor:pointer;font-family:DM Sans,Outfit;font-weight:500;font-size:11.7px;color:#fff;border:1px solid rgba(255,255,255,.5);background:linear-gradient(135deg,var(--sc1),var(--sc2));box-shadow:0 6px 18px rgba(var(--s2),.35);display:flex;align-items:center;justify-content:center;gap:5px}
/* overlay + editor */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(120,80,80,.22);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:20px}
.editor{width:100%;max-width:330px;border-radius:26px;padding:22px 22px 20px;animation:pop .35s cubic-bezier(.2,.8,.2,1) both;max-height:86vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
.ed-hd{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.ed-hd .t{font-family:DM Sans,Outfit;font-weight:500;font-size:14.4px;color:var(--ink)}
.ed-sub{font-family:Inter;font-size:11.2px;color:var(--muted);margin:0 0 16px}
.ed-lab{display:block;font-family:DM Sans,Outfit;font-size:10.8px;color:var(--muted);letter-spacing:.3px;margin-bottom:7px}
.ed-time{width:100%;height:50px;padding:0 14px;border-radius:14px;font-family:DM Sans,Outfit;font-size:14px;color:var(--accent);background:var(--field);border:1px solid var(--glass-bd);outline:none}
.presets{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.preset{flex-grow:1;flex-basis:30%;height:42px;border-radius:12px;cursor:pointer;font-family:DM Sans,Outfit;font-size:10.8px;color:var(--accent);background:var(--field);border:1px solid var(--glass-bd);box-shadow:inset 0 1px 1px rgba(255,255,255,.5)}
.segs{display:flex;gap:6px}
.seg{flex:1;height:46px;border-radius:13px;cursor:pointer;font-family:DM Sans,Outfit;font-size:12.2px;color:var(--muted);background:var(--field);border:1px solid var(--glass-bd);box-shadow:inset 0 1px 1px rgba(255,255,255,.5);transition:all .2s}
.seg.on{color:var(--accent);font-weight:500;background:linear-gradient(135deg,rgba(var(--s1),.6),rgba(var(--s2),.6));border:1px solid rgba(255,255,255,.7)}
.ed-note{font-family:Inter;font-size:10.3px;color:var(--faint);margin:8px 0 0;line-height:1.5}
.ed-btns{display:flex;gap:8px;margin-top:20px}
.ed-btns .soft-btn,.ed-btns .solid-btn{height:48px;border-radius:14px;font-size:12.2px}
.emoji-card{width:100%;max-width:320px;border-radius:24px;padding:20px;animation:pop .35s cubic-bezier(.2,.8,.2,1) both}
.emoji-card .t{font-family:DM Sans,Outfit;font-weight:500;font-size:14.4px;color:var(--ink);margin-bottom:14px}
.emoji-grid{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.emoji-opt{width:50px;height:50px;border-radius:13px;cursor:pointer;font-size:19.4px;line-height:1;display:flex;align-items:center;justify-content:center;background:var(--field);border:1px solid var(--glass-bd)}
/* celebration */
.celeb{position:fixed;inset:0;z-index:60;pointer-events:none;overflow:hidden}
.spk{position:absolute;top:105%;opacity:0;will-change:transform,opacity;animation:floatUp cubic-bezier(.3,.1,.3,1) 1 both}
.celeb .msg{position:absolute;top:37%;left:0;right:0;text-align:center;font-family:DM Sans,Outfit;font-weight:500;font-size:21.2px;color:var(--accent);letter-spacing:.3px;text-shadow:0 2px 20px rgba(var(--s2),.5);display:flex;align-items:center;justify-content:center;gap:8px;animation:msgPop 2.8s ease both}
@keyframes rise{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@keyframes drop{from{opacity:0;transform:translateY(-14px) scale(.97)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.96)}to{opacity:1;transform:none}}
@keyframes floatUp{0%{transform:translateY(0) rotate(0) scale(.6);opacity:0}15%{opacity:1}70%{opacity:1}100%{transform:translateY(-118vh) rotate(28deg) scale(1);opacity:0}}
@keyframes msgPop{0%{opacity:0;transform:translateY(14px) scale(.9)}14%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0}}
.lock-screen{position:fixed;inset:0;z-index:80;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;overflow-y:auto}
.lock-screen.authfull{justify-content:flex-start;padding:0 20px 40px}
.auth-page{width:100%;max-width:360px;margin:0 auto;position:relative;z-index:2}
.auth-hero-title{font-family:DM Sans,Outfit;font-weight:400;font-size:35.6px;letter-spacing:-.5px;line-height:1;background:linear-gradient(100deg,#C25A7C,#E58F6B);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
html[data-theme="dark"] .auth-hero-title{background:linear-gradient(100deg,#F3A7C4,#F6B693);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.lock-inner{display:flex;flex-direction:column;align-items:center}
.lock-title{font-family:DM Sans,Outfit;font-weight:500;font-size:18.4px;color:var(--ink);margin-top:6px}
.lock-sub{font-family:DM Sans,Outfit;font-weight:300;font-size:11.7px;color:var(--muted);margin-top:6px;text-align:center;min-height:20px}
.pin-dots{display:flex;gap:15px;margin:20px 0 28px}
.pin-dot{width:15px;height:15px;border-radius:50%;background:var(--field);border:1px solid var(--glass-bd);transition:all .15s}
.pin-dot.on{background:linear-gradient(135deg,var(--sc1),var(--sc2));border-color:transparent;transform:scale(1.1)}
.keypad{display:grid;grid-template-columns:repeat(3,76px);gap:16px}
.key{width:76px;height:76px;border-radius:50%;font-family:DM Sans,Outfit;font-weight:400;font-size:22.5px;color:var(--ink);background:var(--glass-bg);backdrop-filter:blur(22px) saturate(165%);-webkit-backdrop-filter:blur(22px) saturate(165%);border:1px solid var(--glass-bd);box-shadow:var(--glass-sh);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .1s}
.key:active{transform:scale(.94)}
.key.blank{background:transparent;border:none;box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none;cursor:default}
.key.del{font-size:19.4px;color:var(--muted)}
.lock-link{margin-top:24px;background:none;border:none;color:var(--accent);font-family:DM Sans,Outfit;font-size:10.8px;cursor:pointer;opacity:.85}
.shake{animation:shk .42s}
@keyframes shk{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:90;padding:11px 20px;border-radius:99px;font-family:DM Sans,Outfit;font-weight:500;font-size:10.8px;color:var(--accent);animation:drop .35s both}
.auth-card{width:100%;max-width:340px;border-radius:26px;padding:26px 24px;animation:pop .35s cubic-bezier(.2,.8,.2,1) both}
.auth-in{width:100%;height:50px;padding:0 16px;border-radius:14px;font-family:Inter;font-size:13.1px;color:var(--ink);background:var(--field);border:1px solid var(--glass-bd);outline:none;margin-top:10px}
.auth-in::placeholder{color:var(--faint)}
.auth-primary{width:100%;height:50px;border-radius:14px;margin-top:16px;flex:none}
.auth-err{color:#D1568F;font-family:Inter;font-size:10.3px;margin-top:10px;min-height:16px;text-align:center}
.wordmark{display:flex;align-items:baseline;justify-content:center;gap:4px;width:100%;margin:0 0 12px;background:none;border:none;cursor:pointer;line-height:1}
.wordmark-row{position:relative;display:flex;align-items:center;justify-content:center}
.back-home{position:absolute;left:0;top:50%;transform:translateY(-50%);margin-top:-6px;width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--accent);cursor:pointer;background:var(--glass-bg);border:1px solid var(--glass-bd);box-shadow:inset 0 1px 1px rgba(255,255,255,.5)}
.auth-brand{display:flex;align-items:baseline;justify-content:center;gap:4px;margin-bottom:2px}
.auth-tag{text-align:center;font-family:DM Sans,Outfit;font-weight:500;font-style:italic;font-size:10.8px;color:var(--accent);margin-bottom:12px}
.remember{display:flex;align-items:center;gap:9px;background:none;border:none;cursor:pointer;font-family:DM Sans,Outfit;font-weight:500;font-size:11.2px;color:var(--muted);margin:2px 2px 4px;padding:2px}
.remember .rbox{width:20px;height:20px;border-radius:7px;border:1.6px solid var(--glass-bd);background:var(--field);flex-shrink:0;position:relative}
.remember.on{color:var(--accent)}
.remember.on .rbox{background:linear-gradient(135deg,var(--sc1),var(--sc2));border-color:transparent}
.remember.on .rbox::after{content:"";position:absolute;left:6px;top:2px;width:5px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.rem-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:2px 2px 4px}
.rem-row .remember{margin:0}
.rem-row .lock-link{margin:0;white-space:nowrap}
.wm-ugc{font-family:DM Sans,Outfit;font-weight:600;font-size:19.4px;letter-spacing:.5px;color:var(--ink)}
.wm-vault{font-family:DM Sans,Outfit;font-weight:600;font-size:19.4px;letter-spacing:.5px;color:var(--ink)}
.home-hero{text-align:center;padding:2px 0;margin-bottom:8px}
.home-spark{font-family:DM Sans,Outfit;font-size:12.2px;color:var(--accent);opacity:.8;letter-spacing:2px;margin-bottom:10px}
.home-title{font-family:DM Sans,Outfit;font-weight:400;font-size:35.6px;color:var(--ink);letter-spacing:-.5px;line-height:1}
.ht-vault{font-family:DM Sans,Outfit;font-weight:400;font-size:1em;color:var(--ink)}
.home-rule{height:2px;width:120px;margin:14px auto 0;border-radius:2px;background:linear-gradient(90deg,transparent,rgba(var(--s1),.8),rgba(var(--s2),.8),transparent)}
.home-sub{font-family:DM Sans,Outfit;font-weight:400;font-size:12.6px;color:var(--ink);margin-top:12px;letter-spacing:.3px}
.home-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:22px;position:relative;z-index:2}
.home-card{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;padding:20px 8px 16px;border-radius:22px;cursor:pointer;border:1px solid var(--glass-bd)}
.home-top2{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-top:8px}
.greet-date{font-family:DM Sans,Outfit;font-weight:500;font-size:11px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;margin-bottom:7px}
.greet-title{font-family:Fraunces,Outfit,serif;font-weight:500;font-size:33px;line-height:1.02;letter-spacing:-.3px;color:var(--ink)}
.goal-card{border-radius:26px;padding:20px 20px 18px;margin-top:20px;background:linear-gradient(120deg,#CDEDE8 0%,#C6E6F0 52%,#BEDFF5 100%);border:1px solid rgba(255,255,255,.6);box-shadow:0 10px 30px rgba(var(--sh),.14)}
[data-theme="dark"] .goal-card{background:linear-gradient(120deg,#1C3A38 0%,#1B3540 52%,#1A3048 100%);border-color:rgba(255,255,255,.10);box-shadow:none}
.goal-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.goal-lab{font-family:DM Sans,Outfit;font-weight:600;font-size:11.5px;letter-spacing:.14em;color:var(--accent);text-transform:uppercase}
.goal-amt{border:none;background:transparent;cursor:pointer;font-family:Fraunces,Outfit,serif;font-style:italic;font-weight:500;font-size:19px;color:var(--accent);padding:0}
.goal-body{display:flex;align-items:center;gap:16px;margin-top:14px}
.ring-wrap{position:relative;width:132px;height:132px;flex:none}
.ring-wrap svg{display:block}

@keyframes pophrt{0%{opacity:0;transform:translate(-50%,-50%) scale(.5) rotate(0)}22%{opacity:1;transform:translate(-50%,-60%) scale(1) rotate(var(--rot,0deg))}100%{opacity:0;transform:translate(-50%,-76%) scale(1.35) rotate(var(--rot,0deg));filter:blur(1.5px)}}
@media(prefers-reduced-motion:reduce){.pophrt{display:none}}
.twk{position:fixed;z-index:70;pointer-events:none;transform:translate(-50%,-50%);will-change:transform,opacity;animation:twk .78s ease-out forwards}
.twk .spk-svg{display:block;filter:drop-shadow(0 0 5px rgba(240,130,200,.85))}
@keyframes twk{0%{opacity:0;transform:translate(-50%,-50%) scale(.2) rotate(0)}35%{opacity:1;transform:translate(-50%,-56%) scale(1.05) rotate(35deg)}100%{opacity:0;transform:translate(-50%,-66%) scale(.5) rotate(80deg)}}
@media(prefers-reduced-motion:reduce){.twk{display:none}}
button:focus-visible,input:focus-visible{outline:2px solid rgba(var(--s2),.9);outline-offset:2px}
@media(prefers-reduced-motion:reduce){.row,.spk{animation:none}.spk{display:none}.celeb .msg{animation:none;opacity:1}.dangle{animation:none}}

/* ═══ Blush theme: every section gets its own color ═══ */
body[data-sec="tasks"]{--s1:175,225,215;--s2:120,200,185;--sc1:#B7E4DC;--sc2:#82CBBC;--accent:#1F7A6C;--blob1:#C3EDE4;--blob2:#A0DECF;--h1:#DFF7F1;--h2:#6FC4B0;--h3:#2A9483;--bg:linear-gradient(180deg,#F3FBFA 0%,#E6F7F3 60%,#DBF0EA 100%)}
body[data-sec="scripts"]{--s1:246,190,208;--s2:232,150,182;--sc1:#F6C1D3;--sc2:#E99BB8;--accent:#A33A67;--blob1:#F8C9DA;--blob2:#F0B2CB;--h1:#FCD2EC;--h2:#F282C2;--h3:#CE4E9C;--bg:linear-gradient(180deg,#FEF6F9 0%,#FBEAF1 60%,#F7E0EA 100%)}

body[data-sec="payments"]{--s1:190,232,214;--s2:140,210,182;--sc1:#C4EAD7;--sc2:#8FD0B3;--accent:#2B7358;--blob1:#C9EDDA;--blob2:#A9E0C6;--h1:#D9F6E8;--h2:#6FCBA0;--h3:#2E9C71;--bg:linear-gradient(180deg,#F5FBF8 0%,#E9F6EF 60%,#DFF0E7 100%)}
body[data-sec="resources"]{--s1:190,222,242;--s2:150,196,232;--sc1:#C5E1F4;--sc2:#98C7E8;--accent:#2F668E;--blob1:#C9E3F5;--blob2:#A9D2EE;--h1:#DCEEFB;--h2:#7FBBE6;--h3:#3C86BC;--bg:linear-gradient(180deg,#F5FAFE 0%,#E9F2FA 60%,#DFEBF6 100%)}
body[data-sec="calendar"]{--s1:180,222,245;--s2:130,195,235;--sc1:#B9E0F6;--sc2:#82C6EA;--accent:#1F7AA6;--blob1:#C7E7FA;--blob2:#A3D5F0;--h1:#DEF1FC;--h2:#6FBEE6;--h3:#2A93C2;--bg:linear-gradient(180deg,#F3FBFE 0%,#E5F6FD 60%,#D9EFFB 100%)}
html[data-theme="dark"] body[data-sec]{--bg:linear-gradient(160deg,#261D26 0%,#2C2129 45%,#241E22 75%,#1C232C 100%)}
html[data-theme="dark"] body[data-sec="tasks"]{--accent:#7FDCC7;--bg:linear-gradient(160deg,#182824 0%,#1D2E29 50%,#152420 100%)}
html[data-theme="dark"] body[data-sec="scripts"]{--accent:#F4A9C4;--bg:linear-gradient(160deg,#2A1E27 0%,#302230 50%,#241A26 100%)}
html[data-theme="dark"] body[data-sec="deals"]{--accent:#CDBDF7;--bg:linear-gradient(160deg,#231E2F 0%,#292235 50%,#1F1A2B 100%)}
html[data-theme="dark"] body[data-sec="payments"]{--accent:#9FDDC0;--bg:linear-gradient(160deg,#1E2925 0%,#232E2A 50%,#1B2421 100%)}
html[data-theme="dark"] body[data-sec="resources"]{--accent:#A8D3F0;--bg:linear-gradient(160deg,#1E2530 0%,#232A36 50%,#1B212B 100%)}
html[data-theme="dark"] body[data-sec="calendar"]{--accent:#8FD4F2;--bg:linear-gradient(160deg,#172530 0%,#1C2C38 50%,#14212B 100%)}
html body.script-editing[data-sec]{--accent:#A33A67}

/* type: italic serif headings like his, sans for everything else */
html body h1{font-family:Fraunces,Georgia,serif;font-style:italic;font-weight:600;font-size:33px;letter-spacing:-.4px;line-height:1.05}
html body h1.greet-title{font-size:37px;line-height:1.02}
.today-title{font-style:italic;font-weight:600;font-size:26px}
.st-num,.ring-pct{font-weight:600}
.goal-lab,.gs-lab,.st-lab,.greet-date{color:var(--muted)}
.goal-lab{color:var(--accent)}
.wm-ugc{font-weight:700;letter-spacing:.6px;color:var(--ink)}
.wm-vault{font-family:Fraunces,Georgia,serif;font-style:italic;font-weight:600;font-size:22px;letter-spacing:0;color:var(--accent)}
.list h2{font-family:Fraunces,Georgia,serif;font-style:italic;font-weight:600;font-size:18px;letter-spacing:-.1px}

/* tabs: each section wears its own pastel */
.tabs{padding:4px 2px 10px;margin:2px 0 6px}
.tab{--tc:248,205,190;--tf:#8C4A5E;color:var(--tf);background:rgba(var(--tc),.38);border:1px solid rgba(255,255,255,.7);box-shadow:none;font-weight:500}
.tab.t-home{--tc:248,205,190;--tf:#8C4A5E}
.tab.t-tasks{--tc:175,225,215;--tf:#1F7A6C}
.tab.t-scripts{--tc:246,190,208;--tf:#A33A67}
.tab.t-deals{--tc:215,201,245;--tf:#5B449E}
.tab.t-payments{--tc:190,232,214;--tf:#2B7358}
.tab.t-calendar{--tc:180,222,245;--tf:#1F7AA6}
.tab.t-resources{--tc:190,222,242;--tf:#2F668E}
.tabs .tab.on{color:var(--tf);font-weight:600;background:rgba(var(--tc),.95);border:1px solid rgba(255,255,255,.85);box-shadow:0 5px 14px rgba(var(--tc),.65)}
html[data-theme="dark"] .tab{background:rgba(var(--tc),.14);border-color:rgba(var(--tc),.22);color:rgb(var(--tc))}
html[data-theme="dark"] .tabs .tab.on{background:rgba(var(--tc),.9);color:#2A201E;border-color:transparent;box-shadow:0 5px 16px rgba(var(--tc),.28)}

/* home */
.goal-card{background:linear-gradient(120deg,#CDEDE8 0%,#C6E6F0 52%,#BEDFF5 100%);border:1px solid rgba(255,255,255,.7);box-shadow:0 12px 30px rgba(var(--sh),.10)}
html[data-theme="dark"] .goal-card{background:linear-gradient(120deg,#1C3A38 0%,#1B3540 52%,#1A3048 100%)}
.stat-tile{border-color:rgba(255,255,255,.9)}
.stat-tile:nth-child(1){background:linear-gradient(165deg,rgba(224,212,248,.95),rgba(255,255,255,.7))}
.stat-tile:nth-child(1) .st-num{color:#5B449E}
.stat-tile:nth-child(2){background:linear-gradient(165deg,rgba(203,238,220,.95),rgba(255,255,255,.7))}
.stat-tile:nth-child(2) .st-num{color:#2B7358}
.stat-tile:nth-child(3){background:linear-gradient(165deg,rgba(250,214,190,.95),rgba(255,255,255,.7))}
.stat-tile:nth-child(3) .st-num{color:#A2512B}
html[data-theme="dark"] .stat-tile:nth-child(1){background:rgba(185,160,240,.16)}
html[data-theme="dark"] .stat-tile:nth-child(2){background:rgba(140,215,185,.14)}
html[data-theme="dark"] .stat-tile:nth-child(3){background:rgba(246,190,160,.15)}
html[data-theme="dark"] .stat-tile .st-num{color:var(--ink)}
.due-card{background:linear-gradient(120deg,#FCE8DA 0%,#F9E1D5 60%,#FBEADF 100%);border-color:rgba(255,255,255,.8)}
html[data-theme="dark"] .due-card{background:rgba(246,190,160,.12)}
.due-time{color:#B5502F;background:rgba(246,190,160,.55)}
.due-batch{color:#5B449E;background:rgba(200,182,240,.5)}
.due-empty{background:linear-gradient(120deg,rgba(250,214,190,.4),rgba(255,255,255,.75))}
.today-tasks{background:linear-gradient(120deg,rgba(246,190,208,.38),rgba(255,255,255,.75))}
.glass.card{background:linear-gradient(135deg,rgba(var(--s1),.5),rgba(255,255,255,.78))}
html[data-theme="dark"] .glass.card{background:rgba(var(--s2),.14)}

/* cards: lists, deals, payments and brands rotate through five pastels */
.lt-0{--lt1:255,233,220;--lt2:250,208,182;--lt3:240,165,125;--ltx:#9A4B25}
.lt-1{--lt1:253,228,238;--lt2:245,198,218;--lt3:234,150,186;--ltx:#9B3862}
.lt-2{--lt1:238,230,251;--lt2:212,198,241;--lt3:170,148,226;--ltx:#55409A}
.lt-3{--lt1:224,245,234;--lt2:188,229,209;--lt3:120,200,166;--ltx:#2A6E54}
.lt-4{--lt1:228,241,251;--lt2:192,221,243;--lt3:120,176,222;--ltx:#2C6088}
html[data-theme="dark"] .lt-0{--ltx:#F7BE9C}
html[data-theme="dark"] .lt-1{--ltx:#F6A9C6}
html[data-theme="dark"] .lt-2{--ltx:#CDBDF7}
html[data-theme="dark"] .lt-3{--ltx:#9FDDC0}
html[data-theme="dark"] .lt-4{--ltx:#A8D3F0}
.list[class*="lt-"],.deal-card[class*="lt-"],.brand-card[class*="lt-"]{background:linear-gradient(150deg,rgba(var(--lt1),.96),rgba(var(--lt2),.55));border:1px solid rgba(255,255,255,.85)}
html[data-theme="dark"] .list[class*="lt-"],html[data-theme="dark"] .deal-card[class*="lt-"],html[data-theme="dark"] .brand-card[class*="lt-"]{background:linear-gradient(150deg,rgba(var(--lt3),.2),rgba(var(--lt3),.07));border-color:rgba(255,255,255,.1)}
.list[class*="lt-"] h2{color:var(--ltx)}
.list[class*="lt-"] .check{border-color:rgba(var(--lt3),.75)}
.list[class*="lt-"] .check.on,.list[class*="lt-"] .add-btn{background:linear-gradient(135deg,rgb(var(--lt2)),rgb(var(--lt3)));box-shadow:0 6px 16px rgba(var(--lt3),.35)}
.list[class*="lt-"] .row{border-bottom-color:rgba(255,255,255,.6)}
.list[class*="lt-"] .remind-all,.list[class*="lt-"] .chip.on{background:rgba(var(--lt2),.75);color:var(--ltx);border-color:rgba(255,255,255,.7)}
html[data-theme="dark"] .list[class*="lt-"] .row{border-bottom-color:rgba(255,255,255,.07)}
html[data-theme="dark"] .list[class*="lt-"] .remind-all,html[data-theme="dark"] .list[class*="lt-"] .chip.on{background:rgba(var(--lt3),.25)}
.deal-card[class*="lt-"] .deal-rate,.brand-card[class*="lt-"] .cnt{color:var(--ltx);opacity:1}
.brand-card[class*="lt-"] .bar{background:linear-gradient(rgb(var(--lt2)),rgb(var(--lt3)))}

/* status pills: peach, mint, lavender, rose, butter */
.deal-status{background:#F8D7C4;color:#A2512B;border:none;font-weight:600}
.deal-status.s-paid,.deal-status.s-collected{background:#CDEBDD;color:#2B7358}
.deal-status.s-pending{background:#DDD2F5;color:#5B449E}
.deal-status.s-due{background:#F6CADB;color:#A33A67}
.deal-status.s-pitched{background:#F6E7B8;color:#7E600F}
html[data-theme="dark"] .deal-status{background:rgba(246,190,160,.22);color:#F7C6A6}
html[data-theme="dark"] .deal-status.s-paid,html[data-theme="dark"] .deal-status.s-collected{background:rgba(140,215,185,.2);color:#A6E3C7}
html[data-theme="dark"] .deal-status.s-pending{background:rgba(185,160,240,.22);color:#D2C4F8}
html[data-theme="dark"] .deal-status.s-due{background:rgba(240,150,185,.22);color:#F7B4CD}
html[data-theme="dark"] .deal-status.s-pitched{background:rgba(240,215,130,.2);color:#F2DE98}

/* small touches */
.add-btn,.solid-btn{color:#fff;text-shadow:0 1px 1px rgba(var(--sh),.25)}
.deal-brand,.sec-title{color:var(--ink)}

/* ═══ calmer layout: folds, menus, fewer buttons on screen ═══ */
.menu-btn{color:var(--accent)}
.chev{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;flex-shrink:0;color:var(--ltx,var(--accent));transition:transform .2s ease}
.list.open .chev,.fold.open .fold-head .chev,.sec-fold.open .chev{transform:rotate(90deg)}
.list .list-head{cursor:pointer;margin-bottom:0;min-height:40px}
.list.open .list-head{margin-bottom:10px}
.list.closed{padding:12px 14px}
.list-emoji{font-size:16px;line-height:1;flex-shrink:0}
.list h2{cursor:inherit}
.lh-count{font-family:DM Sans,Outfit;font-weight:600;font-size:11.5px;color:var(--ltx,var(--accent));background:rgba(255,255,255,.6);padding:5px 10px;border-radius:99px;white-space:nowrap}
html[data-theme="dark"] .lh-count{background:rgba(255,255,255,.08)}
.more-btn{width:36px;height:36px;border-radius:50%;border:none;background:transparent;color:var(--muted);font-size:20px;line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.more-btn[aria-expanded="true"]{background:rgba(255,255,255,.6);color:var(--accent)}
.chip.sm{height:30px;padding:0 10px;font-size:10.8px}
.row-more{display:flex;flex-wrap:wrap;gap:6px;padding:2px 4px 12px 37px;animation:rise .2s ease both}
.count-row + .row-more{padding-left:4px}
.act{height:34px;padding:0 12px;border-radius:99px;border:1px solid var(--glass-bd);background:var(--field);font-family:DM Sans,Outfit;font-weight:500;font-size:11.5px;color:var(--ltx,var(--accent));display:flex;align-items:center;gap:5px;cursor:pointer}
.act.danger{color:#C0476F}
.fold{border-radius:18px;margin-bottom:16px;padding:0}
.fold-head{width:100%;display:flex;align-items:center;gap:8px;padding:14px 16px;border:none;background:transparent;font-family:DM Sans,Outfit;font-weight:500;font-size:12.5px;color:var(--accent);cursor:pointer;text-align:left}
.fold-head .fold-t{flex:1;display:flex;align-items:center;gap:6px}
.fold-n{font-size:11px;color:var(--muted);font-weight:400}
.fold-body{display:none;padding:0 12px 12px}
.fold.open .fold-body{display:block}
.fold-body .pin-focus{margin-bottom:0}
.tip{display:flex;align-items:center;gap:10px;border-radius:16px;padding:12px 12px 12px 14px;margin-bottom:14px;font-family:DM Sans,Outfit;font-size:12px;color:var(--ink);line-height:1.45}
.tip .tip-t{flex:1}
.sec-fold{margin:16px 2px 8px}
.sec-toggle{display:flex;align-items:center;gap:6px;border:none;background:transparent;cursor:pointer;padding:6px 0;color:var(--ink)}
.sec-n{font-family:DM Sans,Outfit;font-size:11px;color:var(--muted);margin-left:2px}
.sheet-ov{align-items:flex-end;padding:0}
.editor.sheet{max-width:520px;border-radius:26px 26px 0 0;padding:20px 18px calc(18px + env(safe-area-inset-bottom));animation:sheetUp .28s cubic-bezier(.2,.8,.2,1) both}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:none}}
.menu-item{width:100%;display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:14px;border:1px solid var(--glass-bd);background:var(--field);margin-top:8px;font-family:DM Sans,Outfit;font-weight:500;font-size:13.5px;color:var(--ink);cursor:pointer;text-align:left}
.menu-item .mi-ic{width:22px;display:flex;justify-content:center;font-size:16px;color:var(--accent)}
.menu-item .mi-l{flex:1}
.menu-item .mi-sub{font-size:11.5px;color:var(--muted);font-weight:400;max-width:45%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.menu-item.danger,.menu-item.danger .mi-ic{color:#C0476F}
@media(prefers-reduced-motion:reduce){.editor.sheet,.row-more{animation:none}.chev{transition:none}}
.deal-meta1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12.3px}

/* ═══ subscription screen ═══ */
.paywall{justify-content:flex-start;padding:calc(28px + env(safe-area-inset-top)) 20px calc(28px + env(safe-area-inset-bottom))}
.paywall ~ .overlay{z-index:85}
.pw-page{width:100%;max-width:400px;margin:0 auto;display:flex;flex-direction:column;align-items:stretch}
.pw-hero{text-align:center;margin-top:8px}
.pw-heart{display:flex;justify-content:center;margin-bottom:8px}
.pw-title{font-family:Fraunces,Georgia,serif;font-style:italic;font-weight:600;font-size:30px;line-height:1.1;color:var(--ink);text-align:center;margin-top:14px}
.pw-sub{font-family:DM Sans,Outfit;font-size:13.5px;color:var(--muted);text-align:center;margin-top:8px;line-height:1.5}
.pw-perks{list-style:none;margin:22px 4px 6px;display:flex;flex-direction:column;gap:11px}
.pw-perks li{display:flex;align-items:flex-start;gap:10px;font-family:DM Sans,Outfit;font-size:14px;color:var(--ink);line-height:1.4}
.pw-perks li .xh{margin-top:2px;flex-shrink:0}
.pw-plans{display:flex;flex-direction:column;gap:10px;margin-top:18px}
.pw-loading{font-family:DM Sans,Outfit;font-size:12.5px;color:var(--muted);text-align:center;padding:18px 0}
.pw-plan{position:relative;display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;padding:16px 16px;border-radius:18px;cursor:pointer;text-align:left;background:var(--glass-bg);border:1.5px solid var(--glass-bd);box-shadow:var(--glass-sh)}
.pw-plan.on{border-color:var(--accent);background:linear-gradient(135deg,rgba(var(--s1),.45),rgba(var(--s2),.45))}
.pw-plan-t{font-family:DM Sans,Outfit;font-weight:600;font-size:15px;color:var(--ink)}
.pw-plan-s{font-family:DM Sans,Outfit;font-size:12px;color:var(--muted);margin-top:2px}
.pw-plan-p{font-family:DM Sans,Outfit;font-weight:600;font-size:14px;color:var(--accent);white-space:nowrap}
.pw-badge{position:absolute;top:-10px;right:14px;font-family:DM Sans,Outfit;font-weight:600;font-size:10.5px;letter-spacing:.03em;text-transform:uppercase;color:#fff;background:var(--accent);padding:4px 10px;border-radius:99px}
.pw-cta{flex:none;width:100%;height:54px;border-radius:16px;margin-top:18px;font-size:15px;font-weight:600;background:var(--accent);text-shadow:none;box-shadow:0 8px 22px rgba(var(--sh),.25)}
.pw-cta[disabled]{opacity:.6}
.pw-fine{font-family:Inter;font-size:10.8px;line-height:1.55;color:var(--muted);text-align:center;margin-top:12px}
.pw-links{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 16px;margin-top:10px}
.pw-links .lock-link{margin-top:6px;font-size:12px;text-decoration:none}

/* ═══ notes ═══ */
.note-list{display:flex;flex-direction:column;gap:10px;margin-bottom:6px}
.note-card{border-radius:18px;padding:14px 16px;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.note-card.dragging{box-shadow:0 8px 22px rgba(var(--sh),.28)}
.note-card-t{font-family:Fraunces,Georgia,serif;font-style:italic;font-weight:600;font-size:17px;color:var(--ink);overflow-wrap:anywhere}
.note-card-p{font-family:Inter;font-size:13px;color:var(--muted);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.note-card-d{font-family:DM Sans,Outfit;font-size:10.8px;color:var(--faint);margin-top:6px}
.note-top{display:flex;align-items:center;justify-content:space-between;margin:6px 0 10px}
.note-title-in{font-family:Fraunces,Georgia,serif;font-style:italic;font-weight:600;font-size:26px}
.note-body{min-height:55vh;font-size:15px;line-height:1.65;resize:none;overflow:hidden}
.link-row .more-btn{width:32px;height:32px}

/* ═══ subtasks + linked scripts ═══ */
.t-col{flex:1;min-width:0}
.t-col .t-txt{display:block}
.t-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:5px}
.row.count-row .t-meta{padding-left:33px}
.meta-chip{display:inline-flex;align-items:center;gap:4px;max-width:100%;height:26px;padding:0 10px;border-radius:99px;border:1px solid var(--glass-bd);background:var(--field);font-family:DM Sans,Outfit;font-weight:500;font-size:11px;color:var(--ltx,var(--accent));cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta-chip.on{background:rgba(255,255,255,.75)}
.subs{margin:-2px 0 8px 37px;padding:4px 0 4px 12px;border-left:2px solid rgba(var(--lt3,var(--s2)),.45)}
.sub-row{display:flex;align-items:center;gap:8px;padding:5px 0}

<!-- Background music: music.mp3 sits next to this file and only downloads when you first press play. -->
<audio id="bgAudio" loop preload="none" style="display:none">
  <source src="music.mp3" type="audio/mpeg">
</audio>
<script>
var bgAudio = document.getElementById('bgAudio');
var musicPlaying = false;
var musicUserPaused = false;
var musicAutoPaused = false; // paused because tab/app lost focus, not by the user
function applyMusicVolume(){
  if(bgAudio) bgAudio.volume = (typeof S!=="undefined"&&typeof S.volume==="number"?S.volume:70)/100;
}
applyMusicVolume();
bgAudio.addEventListener('play', function(){ musicPlaying = true; });
bgAudio.addEventListener('pause', function(){ musicPlaying = false; });
function pauseMusicHard(){
  if(!bgAudio)return;
  try{ bgAudio.pause(); }catch(e){}
  musicPlaying = false;
}
function toggleMusicPanel(){
  if(!bgAudio)return;
  if(musicPlaying){
    musicUserPaused=true;
    pauseMusicHard();
  } else {
    musicUserPaused=false; musicAutoPaused=false;
    applyMusicVolume();
    try{ bgAudio.play().catch(function(){}); }catch(e){}
  }
}
document.addEventListener('visibilitychange', function(){
  if(!bgAudio)return;
  if(document.hidden){
    if(musicPlaying && !musicUserPaused){
      musicAutoPaused = true;
      pauseMusicHard();
    }
  } else {
    if(musicAutoPaused && !musicUserPaused){
      musicAutoPaused = false;
      applyMusicVolume();
      try{ bgAudio.play().catch(function(){}); }catch(e){}
    }
  }
});
window.addEventListener('blur', function(){
  if(!bgAudio)return;
  if(musicPlaying && !musicUserPaused){
    musicAutoPaused = true;
    pauseMusicHard();
  }
});
</script>

// ── crystal heart helper ──

function seed(){return [

];}

// ── state ──
var KEY="checklist:v1";

var S={lists:[],streak:0,lastComplete:"",win:{start:"08:00",end:"22:00"},mode:"light",focus:[],brands:[],tab:"tasks",taskView:"daily",sound:true,sfxVolume:100,deals:[],payments:[],batches:[],batchPlan:[],batchTarget:0,monthlyGoal:0,resources:{notes:"",links:[]},calendarItems:[]};
var scr={brand:null,script:null};
var actx=null;
var prevAllDone=null;

function applyBlob(p){
  if(p){
    S.lists=p.lists||seed(); S.streak=p.streak||0; S.lastComplete=p.lastComplete||"";
    if(p.win)S.win=p.win; if(p.mode)S.mode=p.mode; S.focus=Array.isArray(p.focus)?p.focus:(p.focus?[p.focus]:[]);
    var lastReset=p.lastReset||"";
    S.lists=S.lists.map(function(l){return Object.assign({emoji:"",kind:"daily"},l,{subs:l.subs.map(function(s){return Object.assign(blankSub(""),s);})});});
    if(lastReset!==today()){
      S.lists=S.lists.map(function(l){return Object.assign({},l,{subs:l.subs.map(function(s){return Object.assign({},s,{done:false,fired:"",snooze:"",count:0,items:(s.items||[]).map(function(i){return Object.assign({},i,{done:false});})});})});});
      S.focus=[];
    }
    if(S.lastComplete!==today()&&S.lastComplete!==yesterday())S.streak=0;
  } else { S.lists=seed(); }
  S.brands=((p&&p.brands)?p.brands:[]).map(normBrand);
  S.tab=(p&&p.tab)||"tasks";
  if(S.tab==="batches")S.tab="tasks";
  S.taskView=(p&&p.taskView==="batch")?"batch":"daily";
  S.deals=((p&&p.deals)?p.deals:[]).map(normDeal);
  S.payments=((p&&p.payments)?p.payments:[]).map(normPayment);
  S.batchTarget=(p&&typeof p.batchTarget==="number")?p.batchTarget:0;
  S.monthlyGoal=(p&&typeof p.monthlyGoal==="number")?p.monthlyGoal:0;
  var rawPlan=((p&&p.batchPlan)?p.batchPlan:[]).slice();
  ((p&&p.batches)?p.batches:[]).forEach(function(x){ // fold the oldest "videos" list in as flat items, tagged by brand

    rawPlan.push({title:x.title,day:"No day",done:x.status==="Made",brand:x.brand,notes:noteBits.join(" — "),refUrl:x.refUrl});
  });
  S.batchPlan=migratePlan(rawPlan);
  S.batches=[];
  S.resources=normResources(p&&p.resources);
  S.calendarItems=((p&&p.calendarItems)?p.calendarItems:[]).map(normCalendarItem);
  S.sound=!(p&&p.sound===false);
  S.sfxVolume=(p&&typeof p.sfxVolume==="number")?p.sfxVolume:100;
  S.musicOn=!(p&&p.musicOn===false);
  S.volume=(p&&typeof p.volume==="number")?p.volume:70;

}
function stateBlob(){return {lists:S.lists,lastReset:today(),streak:S.streak,lastComplete:S.lastComplete,win:S.win,mode:S.mode,focus:S.focus,brands:S.brands,tab:S.tab,taskView:S.taskView,sound:S.sound,sfxVolume:S.sfxVolume,deals:S.deals,payments:S.payments,batches:S.batches,batchPlan:S.batchPlan,batchTarget:S.batchTarget,monthlyGoal:S.monthlyGoal,resources:S.resources,musicOn:S.musicOn,volume:S.volume,calendarItems:S.calendarItems};}
function normCalendarItem(x){x=x||{};return {id:x.id||uid(),date:/^\d{4}-\d{2}-\d{2}$/.test(x.date)?x.date:today(),title:x.title||"",done:!!x.done};}
function normResources(r){r=r||{};
  var pages=Array.isArray(r.pages)?r.pages.map(function(p){return {id:p.id||uid(),title:p.title||"",body:p.body||"",updated:p.updated||""};})
    :(r.notes&&r.notes.trim()?[{id:uid(),title:"Tips & tricks",body:r.notes,updated:new Date().toISOString()}]:[]); // older versions had one big notes box
  return {notes:r.notes||"",pages:pages,links:(r.links||[]).map(function(l){return {id:l.id||uid(),label:l.label||l.url||"link",url:l.url||"#"};})};}
function normBrand(b){b=b||{};var bhooks=(b.hooks||[]).map(function(x){return {id:x.id||uid(),text:x.text||""};});
  return {id:b.id||uid(),name:b.name||"Untitled",notes:b.notes||"",links:(b.links||[]).map(function(l){return {id:l.id||uid(),label:l.label||l.url||"link",url:l.url||"#"};}),
    scripts:(b.scripts||[]).map(function(x){
      var hooks=(x.hooks||[]).map(function(hk){return {id:hk.id||uid(),text:hk.text||""};});
      var captions=(x.captions||[]).map(function(c){return {id:c.id||uid(),text:c.text||""};});
      var refs=(x.references||[]).map(function(r){return {id:r.id||uid(),label:r.label||r.url||"link",url:r.url||"#"};});
      // migrate legacy single hookId -> hooks[], legacy single caption -> captions[]
      if(x.hookId){var srcHk=bhooks.find(function(hh){return hh.id===x.hookId;});if(srcHk&&!hooks.some(function(hh){return hh.text===srcHk.text;}))hooks.push({id:uid(),text:srcHk.text});}
      if(x.caption&&!captions.some(function(c){return c.text===x.caption;}))captions.push({id:uid(),text:x.caption});
      return {id:x.id||uid(),title:x.title||"Untitled script",body:x.body||"",hooks:hooks,captions:captions,references:refs};
    }),
    hooks:bhooks};}
function cacheKey(){return USER?KEY+":"+USER.id:KEY;}
function readLocal(){try{var r=localStorage.getItem(cacheKey());return r?JSON.parse(r):null;}catch(e){return mem?JSON.parse(mem):null;}}
function writeLocal(b){try{localStorage.setItem(cacheKey(),JSON.stringify(b));}catch(e){mem=JSON.stringify(b);}}
var cloudTimer=null;
function cloudSave(b){
  if(!(CLOUD&&USER&&SB))return;
  clearTimeout(cloudTimer);
  cloudTimer=setTimeout(function(){
    SB.from("checklists").upsert({user_id:USER.id,data:b,updated_at:new Date().toISOString()}).then(function(res){if(res&&res.error)console.warn("cloud save:",res.error.message);});
  },700);
}
function save(){var b=stateBlob();writeLocal(b);cloudSave(b);syncNativeReminders();}
function loadState(){
  if(CLOUD&&USER&&SB){
    return SB.from("checklists").select("data").eq("user_id",USER.id).maybeSingle().then(function(res){
      if(res&&res.data&&res.data.data){applyBlob(res.data.data);writeLocal(stateBlob());}
      else{applyBlob(readLocal());save();}
    }).catch(function(){applyBlob(readLocal());});
  }
  applyBlob(readLocal());
  return Promise.resolve();
}
function creditIfDone(){
  var flat=S.lists.reduce(function(a,l){return a.concat(l.subs);},[]);
  var allDone=flat.length>0&&flat.every(function(s){return s.done;});
  if(allDone){
    if(S.lastComplete===today()){}
    else if(S.lastComplete===yesterday()){S.streak+=1;S.lastComplete=today();}
    else {S.streak=1;S.lastComplete=today();}
  }
  // celebration rising edge
  if(prevAllDone!==null&&allDone&&!prevAllDone)celebrate();
  prevAllDone=allDone;
}
function commit(){creditIfDone();save();render();}

// ── mutations ──
function findSub(sid){for(var i=0;i<S.lists.length;i++){var s=S.lists[i].subs.find(function(x){return x.id===sid;});if(s)return {s:s,l:S.lists[i]};}return null;}
function toggle(sid){var f=findSub(sid);if(f){f.s.done=!f.s.done;commit();}}
function patchSub(sid,patch){var f=findSub(sid);if(f){Object.assign(f.s,patch,{fired:""});commit();}}
function delSub(lid,sid){var l=S.lists.find(function(x){return x.id===lid;});l.subs=l.subs.filter(function(s){return s.id!==sid;});commit();}
function addSub(lid,t){t=(t||"").trim();if(!t)return;var l=S.lists.find(function(x){return x.id===lid;});l.subs.push(blankSub(t));commit();}
function toggleFocus(sid){var i=S.focus.indexOf(sid);if(i>=0)S.focus.splice(i,1);else S.focus.push(sid);save();render();}
function focusHas(sid){return S.focus.indexOf(sid)>=0;}
function focusPicker(){
  var ov=h("div",{class:"overlay"});function close(){ov.remove();render();}
  ov.addEventListener("click",function(e){if(e.target===ov)close();});
  var card=h("div",{class:"glass editor"});
  card.appendChild(h("div",{class:"ed-hd",html:'\u2605 <span class="t">Today\u2019s focus</span>'}));
  card.appendChild(h("p",{class:"ed-sub",style:"margin-bottom:12px"},["Tap to pin \u2014 pin as many important tasks as you like."]));
  var listWrap=h("div");card.appendChild(listWrap);
  function fill(){
    listWrap.innerHTML="";var any=false;
    S.lists.forEach(function(l){l.subs.forEach(function(s){ if(s.done&&!focusHas(s.id))return; any=true;
      var on=focusHas(s.id);
      var row=h("button",{class:"pick-row"+(on?" on":""),onclick:function(){toggleFocus2(s.id);fill();}});
      row.appendChild(h("div",{class:"pt"},[(on?"\u2605 ":"\u2606 ")+s.title]));
      row.appendChild(h("div",{class:"pl"},[l.title]));
      listWrap.appendChild(row);
    });});
    if(!any)listWrap.appendChild(h("p",{class:"empty"},["No open tasks to focus on \u2014 add one first."]));
  }
  function toggleFocus2(sid){var i=S.focus.indexOf(sid);if(i>=0)S.focus.splice(i,1);else S.focus.push(sid);save();}
  fill();
  card.appendChild(h("button",{class:"solid-btn",style:"height:46px;border-radius:14px;margin-top:14px;width:100%;flex:none",onclick:close},["done"]));
  ov.appendChild(card);document.body.appendChild(ov);
}
function toggleRepeat(sid){var f=findSub(sid);if(f){f.s.repeat=!f.s.repeat;f.s.fired="";commit();}}
function clearDone(){S.lists=S.lists.map(function(l){return Object.assign({},l,{subs:l.subs.map(function(s){return s.done?Object.assign({},s,{done:false}):s;})});});commit();}
function addList(t,kind){t=(t||"").trim();if(!t)return;S.lists.push({id:uid(),title:t,emoji:"",kind:(kind==="batch"?"batch":"daily"),subs:[]});commit();}

// ── drag (press-and-hold anywhere on the row, reorder DOM nodes, commit on release) ──
// handle = the element you press-and-hold on (listens for the gesture)
// dragEl = the element that actually gets moved/reordered (defaults to handle)
var DRAG_SUPPRESS=new WeakSet();
// One capturing-phase listener on the document, added once, catches the click that
// naturally follows a completed drag *before* any click handler already registered
// on the row (e.g. "open this script") gets a chance to fire — registration order
// on the target itself doesn't help here since those handlers were attached earlier.
document.addEventListener("click",function(e){
  var t=e.target;
  while(t){if(DRAG_SUPPRESS.has(t)){DRAG_SUPPRESS.delete(t);e.stopPropagation();e.preventDefault();return;}t=t.parentElement;}
},true);
function enableDrag(handle,container,onCommit,dragEl){
  dragEl=dragEl||handle;
  handle.addEventListener("pointerdown",function(ev){
    if(ev.target.closest("button:not(.grip),input"))return; // don't hijack taps on controls (but the grip handle itself should always be draggable)
    var startX=ev.clientX,startY=ev.clientY,pid=ev.pointerId,timer=null;
    function cleanupPre(){handle.removeEventListener("pointermove",preMove);handle.removeEventListener("pointerup",preUp);handle.removeEventListener("pointercancel",preUp);if(timer){clearTimeout(timer);timer=null;}}
    function preMove(e){if(Math.abs(e.clientX-startX)>12||Math.abs(e.clientY-startY)>12)cleanupPre();}
    function preUp(){cleanupPre();}
    handle.addEventListener("pointermove",preMove);
    handle.addEventListener("pointerup",preUp);
    handle.addEventListener("pointercancel",preUp);
    timer=setTimeout(function(){
      cleanupPre();
      try{handle.setPointerCapture(pid);}catch(err){}
      dragEl.classList.add("dragging");
      function move(e){
        var kids=[].slice.call(container.children).filter(function(c){return c!==dragEl&&c.dataset.drag;});
        var placed=false;
        for(var i=0;i<kids.length;i++){var r=kids[i].getBoundingClientRect();if(e.clientY<r.top+r.height/2){container.insertBefore(dragEl,kids[i]);placed=true;break;}}
        if(!placed)container.appendChild(dragEl);
      }
      function up(){
        handle.removeEventListener("pointermove",move);handle.removeEventListener("pointerup",up);
        dragEl.classList.remove("dragging");
        DRAG_SUPPRESS.add(dragEl);DRAG_SUPPRESS.add(handle);
        var order=[].slice.call(container.children).filter(function(c){return c.dataset.drag;}).map(function(c){return c.dataset.drag;});
        onCommit(order);
      }
      handle.addEventListener("pointermove",move);handle.addEventListener("pointerup",up);
    },350);
  });
}

// ── drag-to-scroll fallback for horizontally scrolling rows (e.g. tab bar) ──
function enableDragScroll(el){
  var startX=0,startY=0,startScroll=0,dragging=false,locked=null,pid=null,moved=false;
  el.addEventListener("pointerdown",function(e){
    if(e.pointerType==="mouse"&&e.button!==0)return;
    startX=e.clientX;startY=e.clientY;startScroll=el.scrollLeft;dragging=true;locked=null;moved=false;pid=e.pointerId;
  });
  el.addEventListener("pointermove",function(e){
    if(!dragging)return;
    var dx=e.clientX-startX,dy=e.clientY-startY;
    if(locked===null){
      if(Math.abs(dx)<6&&Math.abs(dy)<6)return;
      locked=Math.abs(dx)>Math.abs(dy)?"x":"y";
      if(locked==="x"){try{el.setPointerCapture(pid);}catch(err){}}
    }
    if(locked==="x"){
      moved=true;
      el.scrollLeft=startScroll-dx;
      e.preventDefault();
    } else {
      dragging=false; // vertical intent — let the page scroll normally
    }
  });
  function end(){
    if(!dragging)return;
    dragging=false;
    if(moved){
      el.addEventListener("click",function suppress(ev){ev.stopPropagation();},{capture:true,once:true});
    }
  }
  el.addEventListener("pointerup",end);
  el.addEventListener("pointercancel",end);
}

  function close(){ov.remove();render();}
  var body=h("div",{class:"glass editor"});
  function rebuild(){
    body.innerHTML="";
    body.appendChild(h("div",{class:"ed-hd",html:alarmIcon(19)+' <span class="t">Reminder</span>'}));
    body.appendChild(h("p",{class:"ed-sub"},[target.allLid?("All tasks in "+l.title):s.title]));

    body.appendChild(h("input",{class:"ed-time",type:"time",value:s.remind,onchange:function(e){applyReminderTo(target,{remind:e.target.value});s.remind=e.target.value;}}));

    var segs=h("div",{class:"segs"});
    EVERY.forEach(function(o){segs.appendChild(h("button",{class:"seg"+(s.every===o.v?" on":""),onclick:function(){var p={every:o.v};if(o.v===0)p.until="";applyReminderTo(target,p);Object.assign(s,p);rebuild();}},[o.l]));});
    body.appendChild(segs);
    if(s.every>0){
      body.appendChild(h("label",{class:"ed-lab",style:"margin-top:16px"},["until (optional — stops nudging)"]));
      body.appendChild(h("input",{class:"ed-time",type:"time",value:s.until,onchange:function(e){applyReminderTo(target,{until:e.target.value});s.until=e.target.value;}}));
      body.appendChild(h("p",{class:"ed-note"},["Nudges every "+everyLabel(s.every)+" from "+(s.remind||"start")+(s.until?" until "+s.until:"")+", or until you tick it off."]));
    }
    body.appendChild(h("div",{class:"ed-btns"},[
      h("button",{class:"soft-btn",onclick:function(){var p={remind:"",every:0,until:"",snooze:""};applyReminderTo(target,p);Object.assign(s,p);rebuild();}},["clear"]),
      h("button",{class:"solid-btn",onclick:close},["done"])

// ── reminder banner + tick ──
var banner=null;
function showBanner(hit){
  if(banner)banner.remove();
  var wrap=h("div",{class:"banner-wrap"});
  var card=h("div",{class:"glass banner"});
  card.appendChild(h("div",{class:"hd"},[h("span",{style:"font-size:20px",html:heart(22)}),h("div",{},[h("div",{class:"ti"},[hit.title]),h("div",{class:"su"},[hit.listTitle+" · a little moment"])])]));
  var doneBtn=h("button",{class:"solid-btn",html:"done "+heart(15),onclick:function(){patchSub(hit.sid,{done:true});close();}});
  card.appendChild(h("div",{class:"btns"},[
    h("button",{class:"soft-btn",onclick:function(){patchSub(hit.sid,{snooze:plusMin(10),fired:""});close();}},["snooze 10m"]),
    h("button",{class:"soft-btn",onclick:function(){patchSub(hit.sid,{snooze:plusMin(30),fired:""});close();}},["snooze 30m"]),
    doneBtn
  ]));
  card.appendChild(h("button",{class:"x","aria-label":"dismiss",onclick:function(){close();}},["×"]));
  function close(){wrap.remove();banner=null;}
  wrap.appendChild(card);document.body.appendChild(wrap);banner=wrap;
}
function tick(){
  var hhmm=nowHM();if(!inWindow(hhmm,S.win.start,S.win.end))return;
  var cur=toMin(hhmm),key=today()+"T"+hhmm,hit=null,changed=false;
  S.lists.forEach(function(l){l.subs.forEach(function(s){
    if(s.done||s.fired===key)return;
    var should=false;
    if(s.snooze&&s.snooze===hhmm)should=true;
    else if(s.remind){
      if(!s.every){if(hhmm===s.remind)should=true;}
      else{var st=toMin(s.remind),un=s.until?toMin(s.until):null;if(cur>=st&&(un===null||cur<=un)&&(cur-st)%s.every===0)should=true;}
    }
    if(should){s.fired=key;s.snooze="";changed=true;if(!hit)hit={sid:s.id,title:s.title,listTitle:l.title};}
  });});
  if(changed){save();
    if(hit){showBanner(hit);
      if(!nativeApp()&&typeof Notification!=="undefined"&&Notification.permission==="granted"){try{new Notification("\uD83D\uDC97 "+hit.title,{body:hit.listTitle+" · a little moment for you"});}catch(e){}}
    }
  }
}

// ── celebration ──
function celebrate(){
  var el=h("div",{class:"celeb"});
  for(var i=0;i<18;i++){
    var useHeart=i%3===0;
    var left=(i*5.5+(i%3)*7)%100, delay=(i%6)*0.12, dur=2+(i%5)*0.28, size=14+(i%4)*6;
    var sp=h("span",{class:"spk",style:"left:"+left+"%;font-size:"+size+"px;animation-delay:"+delay+"s;animation-duration:"+dur+"s"});
    sp.innerHTML=useHeart?heart(size):["✦","✧","❀","⋆"][i%4];
    el.appendChild(sp);
  }
  el.appendChild(h("div",{class:"msg",html:"all done for today "+heart(22)}));
  document.body.appendChild(el);
  setTimeout(function(){el.remove();},2800);
}

function playChime(){
  if(!S.sound)return;
  try{
    if(!actx)actx=new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state==="suspended")actx.resume();
    if(!actx.__unlocked){actx.__unlocked=1;try{var bb=actx.createBufferSource();bb.buffer=actx.createBuffer(1,1,22050);bb.connect(actx.destination);bb.start(0);}catch(e){}}
    var t0=actx.currentTime;
    var sfxVol=(S.sfxVolume!=null?S.sfxVolume:100)/100;
    var master=actx.createGain();master.gain.value=0.45*sfxVol;master.connect(actx.destination);
    // ascending twinkle: pure high glints rising like little stars
    var rise=[1568.0,2093.0,2637.0,3136.0,3951.1];
    for(var i=0;i<rise.length;i++){
      var start=t0+i*0.045;
      var o=actx.createOscillator(),g=actx.createGain();
      o.type="sine";o.frequency.value=rise[i];
      g.gain.setValueAtTime(0.0001,start);
      g.gain.exponentialRampToValueAtTime(0.14,start+0.008);
      g.gain.exponentialRampToValueAtTime(0.0001,start+0.28);
      o.connect(g).connect(master);o.start(start);o.stop(start+0.32);
    }
    // soft high shimmer tail
    var s=actx.createOscillator(),sg=actx.createGain();
    s.type="sine";s.frequency.value=5274.0;
    var st=t0+0.05;
    sg.gain.setValueAtTime(0.0001,st);
    sg.gain.exponentialRampToValueAtTime(0.05,st+0.04);
    sg.gain.exponentialRampToValueAtTime(0.0001,st+0.9);
    s.connect(sg).connect(master);s.start(st);s.stop(st+0.95);
  }catch(e){}
}
function spawnHearts(x,y){
  if(x==null)return;
  var specs=[[0,0,19,0],[-13,-9,10,0.05],[12,-11,9,0.1]];
  specs.forEach(function(sp){
    var el=document.createElement("span");el.className="twk";
    el.style.left=(x+sp[0])+"px";el.style.top=(y+sp[1])+"px";
    el.style.animationDelay=sp[3]+"s";
    el.innerHTML=sparkle(sp[2]);
    document.body.appendChild(el);
    (function(n){setTimeout(function(){n.remove();},780);})(el);
  });
}

function todayPlanDay(){return PLAN_DAYS[(new Date().getDay()+6)%7];}
// model: S.batchPlan = [ {id, brand, emoji, items:[{id,title,done,day,notes,refUrl}]} ] — a weekly, brand-grouped checklist
function normBatchItem(x){x=x||{};return {id:x.id||uid(),title:x.title||"",done:!!x.done,day:PLAN_ORDER.indexOf(x.day)>=0?x.day:"No day",notes:x.notes||"",refUrl:x.refUrl||""};}
function normBatchGroup(g){g=g||{};return {id:g.id||uid(),brand:(g.brand||g.name||"Untitled").toString(),emoji:g.emoji||"",items:(g.items||[]).map(normBatchItem)};}
// accept the earlier flat shape (and the oldest S.batches) and fold loose items into brand groups
function migratePlan(raw){
  raw=raw||[];var groups=[],flat=[];
  raw.forEach(function(e){if(e&&Array.isArray(e.items))groups.push(normBatchGroup(e));else if(e&&e.title!=null)flat.push(e);});
  function groupFor(name){name=(name||"").trim()||"Unsorted";var g=groups.find(function(x){return x.brand.toLowerCase()===name.toLowerCase();});if(!g){g=normBatchGroup({brand:name});groups.push(g);}return g;}
  flat.forEach(function(it){groupFor(it.brand).items.push(normBatchItem(it));});
  return groups;
}
function allBatchItems(){return S.batchPlan.reduce(function(a,g){return a.concat(g.items);},[]);}
function findBatchItem(id){for(var i=0;i<S.batchPlan.length;i++){var it=S.batchPlan[i].items.find(function(x){return x.id===id;});if(it)return {it:it,g:S.batchPlan[i]};}return null;}

// ── accounts (Supabase auth + cloud sync) ──
function flash(msg,isHtml){var t=isHtml?h("div",{class:"glass toast",html:msg}):h("div",{class:"glass toast"},[msg]);document.body.appendChild(t);setTimeout(function(){t.remove();},1900);}
function authMsg(m){
  m=(m||"").toLowerCase();
  if(/rate limit|too many|429/.test(m))return "too many tries for now \u2014 wait about an hour, or turn off \u201cConfirm email\u201d in Supabase for instant signup.";
  if(/already registered|already been registered|user already/.test(m))return "that email already has an account \u2014 try \u201clog in\u201d instead.";
  if(/invalid login|invalid credentials|incorrect/.test(m))return "wrong email or password \u2014 double-check and try again.";
  if(/email not confirmed|not confirmed/.test(m))return "check your inbox and tap the confirmation link first.";
  if(/at least 6|password.*6|weak.?password/.test(m))return "password needs at least 6 characters.";
  if(/valid email|invalid email|unable to validate/.test(m))return "that email doesn\u2019t look right \u2014 check it and try again.";
  if(/network|failed to fetch|fetch/.test(m))return "connection issue \u2014 check your internet and try again.";
  return m?m:"something went wrong \u2014 please try again.";
}
function userIcon(){return '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.4"/><path d="M5 20c0-3.6 3.1-6 7-6s7 2.4 7 6"/></svg>';}

function showResetPassword(){
  [].forEach.call(document.querySelectorAll(".lock-screen"),function(n){n.remove();});
  var scr=screenWrap();
  var card=h("div",{class:"glass auth-card"});
  card.appendChild(h("div",{class:"auth-brand",html:'<span class="wm-ugc">UGC</span><span class="wm-vault">Vault</span>'}));
  card.appendChild(h("div",{style:"text-align:center;margin:6px 0 4px",html:heart(38)}));
  card.appendChild(h("div",{class:"lock-title",style:"text-align:center"},["set a new password"]));
  card.appendChild(h("div",{class:"lock-sub"},["choose a new password for your account"]));
  var pass=h("input",{class:"auth-in",type:"password",placeholder:"new password",autocomplete:"new-password"});
  var pass2=h("input",{class:"auth-in",type:"password",placeholder:"confirm new password",autocomplete:"new-password"});
  var err=h("div",{class:"auth-err"});
  var btn=h("button",{class:"solid-btn auth-primary"},["update password"]);
  var busy=false;
  function submit(){
    if(busy)return; err.textContent="";
    var pw=pass.value||"";
    if(pw.length<6){err.textContent="password needs at least 6 characters";return;}
    if(pw!==(pass2.value||"")){err.textContent="passwords don't match";return;}
    busy=true;btn.textContent="\u2026";
    SB.auth.updateUser({password:pw}).then(function(res){
      busy=false;btn.textContent="update password";
      if(res.error){err.textContent=authMsg(res.error.message);return;}
      flash("password updated \u2661");
      scr.remove();
      loadState().then(startApp);
    });
  }
  btn.addEventListener("click",submit);
  pass2.addEventListener("keydown",function(e){if(e.key==="Enter")submit();});
  card.appendChild(pass);card.appendChild(pass2);card.appendChild(err);card.appendChild(btn);
  scr.appendChild(h("div",{class:"lock-inner",style:"width:100%;max-width:340px"},[card]));
  document.body.appendChild(scr);
}
function showAuth(mode){
  var scr=h("div",{class:"lock-screen authfull"});
  var themeBtn=h("button",{class:"theme-btn","aria-label":"toggle theme",onclick:function(){S.mode=S.mode==="light"?"dark":"light";document.documentElement.setAttribute("data-theme",S.mode);try{save();}catch(e){}scr.remove();showAuth(mode);}},[S.mode==="light"?"\u263e":"\uD83C\uDF1E"]);
  var hero=h("div",{},[
    chandelier(),
    h("div",{style:"display:flex;justify-content:flex-end;margin-top:-2px"},[themeBtn]),
    h("div",{class:"home-hero"},[
      h("div",{class:"home-spark",html:"\u2726\u00a0\u00a0\u2661\u00a0\u00a0\u2727\u00a0\u00a0\u2661\u00a0\u00a0\u2726"}),
      h("h1",{class:"auth-hero-title"},["UGC Vault"]),
      h("div",{class:"home-rule"}),
      h("p",{class:"home-sub"},["your all-in-one UGC workspace"])
    ])
  ]);
  var card=h("div",{class:"glass auth-card",style:"margin-top:22px"});
  var title=h("div",{class:"lock-title",style:"text-align:center"},[mode==="signup"?"create your account":"welcome"]);
  var sub=h("div",{class:"lock-sub"},[mode==="signup"?"everything UGC, in one place \u2661":"welcome back, love \u2661"]);
  var email=h("input",{class:"auth-in",type:"email",placeholder:"email",autocapitalize:"none",autocorrect:"off",autocomplete:"email"});
  var pass=h("input",{class:"auth-in",type:"password",placeholder:"password",autocomplete:mode==="signup"?"new-password":"current-password"});
  var remOn=true; try{remOn=localStorage.getItem("uvRemember")!=="0";}catch(e){}
  try{ if(remOn)email.value=localStorage.getItem("uvEmail")||""; }catch(e){}
  var remBox=h("button",{class:"remember"+(remOn?" on":""),type:"button",title:"stay signed in on this device"});
  remBox.innerHTML='<span class="rbox"></span><span>remember me</span>';
  remBox.addEventListener("click",function(){remOn=!remOn;remBox.className="remember"+(remOn?" on":"");try{localStorage.setItem("uvRemember",remOn?"1":"0");}catch(e){}});
  var err=h("div",{class:"auth-err"});
  var primary=h("button",{class:"solid-btn auth-primary"},[mode==="signup"?"sign up":"log in"]);
  var busy=false;
  function rememberEmail(e){try{ if(remOn)localStorage.setItem("uvEmail",e); else localStorage.removeItem("uvEmail"); }catch(x){}}
  function submit(){
    if(busy)return; err.textContent="";
    var e=(email.value||"").trim(), pw=pass.value||"";
    if(!e||!pw){err.textContent="enter your email and password";return;}
    if(mode==="signup"&&pw.length<6){err.textContent="password needs at least 6 characters";return;}
    busy=true;primary.textContent="…";
    var op=mode==="signup"?SB.auth.signUp({email:e,password:pw}):SB.auth.signInWithPassword({email:e,password:pw});
    op.then(function(res){
      busy=false;primary.textContent=mode==="signup"?"sign up":"log in";
      if(res.error){err.textContent=authMsg(res.error.message);return;}
      rememberEmail(e);
      if(mode==="signup"&&!(res.data&&res.data.session)){
        scr.remove();
        var s2=screenWrap();
        var c2=h("div",{class:"glass auth-card",style:"text-align:center"},[
          h("div",{style:"margin-bottom:8px",html:heart(38)}),
          h("div",{class:"lock-title"},["check your email"]),
          h("div",{class:"lock-sub",style:"line-height:1.5;margin-top:10px"},["We sent a confirmation link to "+e+". Tap it, then come back and log in."]),
          h("button",{class:"soft-btn",style:"margin-top:18px;width:100%;height:48px;border-radius:14px;flex:none",onclick:function(){s2.remove();showAuth("login");}},["back to log in"])
        ]);
        s2.appendChild(h("div",{class:"lock-inner",style:"width:100%;max-width:340px"},[c2]));
        document.body.appendChild(s2); return;
      }
      USER=(res.data&&res.data.user)||(res.data&&res.data.session&&res.data.session.user);
      scr.remove(); loadState().then(startApp);
    });
  }
  primary.addEventListener("click",submit);
  pass.addEventListener("keydown",function(e){if(e.key==="Enter")submit();});
  var toggle=h("button",{class:"lock-link",onclick:function(){scr.remove();showAuth(mode==="signup"?"login":"signup");}},[mode==="signup"?"already have an account? log in":"new here? create an account"]);
  var forgot=null;
  if(mode!=="signup"){
    forgot=h("button",{class:"lock-link",style:"font-size:13px;opacity:.85",onclick:function(){
      err.textContent="";
      var e=(email.value||"").trim();
      if(!e){err.textContent="type your email above first, then tap reset";return;}
      forgot.textContent="sending…";
      SB.auth.resetPasswordForEmail(e,{redirectTo:location.href}).then(function(res){
        forgot.textContent="forgot password?";
        if(res&&res.error){err.textContent=authMsg(res.error.message);return;}
        flash("password reset link sent to "+e+" \u2661");
      });
    }},["forgot password?"]);
  }
  card.appendChild(title);card.appendChild(sub);card.appendChild(email);card.appendChild(pass);
  if(forgot){card.appendChild(h("div",{class:"rem-row"},[remBox,forgot]));}
  else{card.appendChild(remBox);}
  card.appendChild(err);card.appendChild(primary);
  var stack=[hero,card]; stack.push(toggle);
  scr.appendChild(h("div",{class:"auth-page"},stack));
  var fx=h("div",{class:"home-fx","aria-hidden":"true"});
  var glyphs=["\u2726","\u2661","\u2727","\uD83E\uDE77","\u2724","\u2661","\u2726","\u2727"];
  glyphs.forEach(function(g,i){
    var sp=h("span",{class:"hfx"});
    sp.style.left=(6+i*12+(i%3)*4)+"%";
    sp.style.fontSize=(11+(i%4)*5)+"px";
    sp.style.animationDelay=(i*0.6)+"s";
    sp.style.animationDuration=(7+(i%5))+"s";
    sp.innerHTML=g;
    fx.appendChild(sp);
  });
  scr.appendChild(fx);
  document.body.appendChild(scr);
}

function deleteAccount(){
  confirmModal("Delete your account and all your UGC Vault data? This can\u2019t be undone.",function(){
    SB.rpc("delete_my_account").then(function(res){
      if(res.error){console.error(res.error);flash("couldn\u2019t delete your account \u2014 email ugcrims@gmail.com and we\u2019ll do it for you");return;}
      try{localStorage.removeItem(cacheKey());}catch(e){}
      if(nativeApp())window.UGCVault.syncTaskReminders([]);

function startApp(){
  var flat=S.lists.reduce(function(a,l){return a.concat(l.subs);},[]);
  prevAllDone=flat.length>0&&flat.every(function(s){return s.done;});
  S.tab="home";
  if(!window.__fx){window.__fx=1;document.addEventListener("click",onGlobalClick,true);}
  window.__appStarted=true;
  render();tick();setInterval(tick,20000);syncNativeReminders();
  checkAccess(); // iPhone app: shows the subscribe screen when there's no active subscription or trial
  if(CLOUD&&USER)document.addEventListener("visibilitychange",function(){if(!document.hidden)loadState().then(render);});
}
(function(){
  document.documentElement.setAttribute("data-theme",S.mode);
  if(!CLOUD){ showSetup(); return; }

    var session=res&&res.data&&res.data.session;
    if(session&&session.user){ USER=session.user; loadState().then(startApp); }
    else { showAuth("login"); }
  });
})();
